# Free Supabase projects pause after 7 quiet days. This pings it once a day so
# Two Peas never falls asleep, even if you both take a break.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          URL=$(grep -oP "SUPABASE_URL: '\K[^']+" js/config.js || true)
          KEY=$(grep -oP "SUPABASE_ANON_KEY: '\K[^']+" js/config.js || true)
          if [ -z "$URL" ]; then echo "Not configured yet"; exit 0; fi
          curl -sS -o /dev/null -w "%{http_code}\n" "$URL/rest/v1/couples?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
